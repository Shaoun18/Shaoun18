<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="How I build"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00e676" stroke-opacity="0.05"/></pattern></defs><rect width="1000" height="250" rx="14" fill="#04100c"/><rect width="1000" height="250" rx="14" fill="url(#grid)"/><rect x="1" y="1" width="998" height="248" rx="14" fill="none" stroke="#00e676" stroke-opacity="0.3"/><text x="36" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="900" fill="#fff">How I Build</text><text x="36" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#6fcf9d">Plan it. Build it. Test it. Ship it.</text><rect x="36" y="100" width="216" height="120" rx="12" fill="#071a11" stroke="#00e676" stroke-opacity="0.6"/><text x="54" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#00e676" letter-spacing="2">01  PLAN</text><text x="54" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#cfe9dc">Requirements, UX flow &amp; architecture</text><rect x="54" y="192" width="180" height="6" rx="3" fill="#ffffff" opacity="0.08"/><rect x="54" y="192" width="0" height="6" rx="3" fill="#00e676"><animate attributeName="width" values="0;180;180;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="272" y="100" width="216" height="120" rx="12" fill="#071a11" stroke="#1DA1F2" stroke-opacity="0.6"/><text x="290" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#1DA1F2" letter-spacing="2">02  BUILD</text><text x="290" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#cfe9dc">Clean PHP / JS / Python code</text><rect x="290" y="192" width="180" height="6" rx="3" fill="#ffffff" opacity="0.08"/><rect x="290" y="192" width="0" height="6" rx="3" fill="#1DA1F2"><animate attributeName="width" values="0;180;180;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect><rect x="508" y="100" width="216" height="120" rx="12" fill="#071a11" stroke="#c084fc" stroke-opacity="0.6"/><text x="526" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#c084fc" letter-spacing="2">03  TEST</text><text x="526" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#cfe9dc">QA, debugging &amp; performance</text><rect x="526" y="192" width="180" height="6" rx="3" fill="#ffffff" opacity="0.08"/><rect x="526" y="192" width="0" height="6" rx="3" fill="#c084fc"><animate attributeName="width" values="0;180;180;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="1.0s" repeatCount="indefinite"/></rect><rect x="744" y="100" width="216" height="120" rx="12" fill="#071a11" stroke="#ffb347" stroke-opacity="0.6"/><text x="762" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#ffb347" letter-spacing="2">04  SHIP</text><text x="762" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#cfe9dc">Release, docs &amp; support</text><rect x="762" y="192" width="180" height="6" rx="3" fill="#ffffff" opacity="0.08"/><rect x="762" y="192" width="0" height="6" rx="3" fill="#ffb347"><animate attributeName="width" values="0;180;180;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect></svg>